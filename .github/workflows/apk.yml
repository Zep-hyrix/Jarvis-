name: APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Uygulamayi hazirla
        run: |
          mkdir app && cd app
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor-community/text-to-speech@5
          mkdir www
          echo '<!doctype html><title>JARVIS</title>' > www/index.html
          echo '{"appId":"com.zephyrix.jarvis","appName":"JARVIS","webDir":"www","server":{"url":"https://zep-hyrix.github.io/Jarvis-/","androidScheme":"https"}}' > capacitor.config.json
          npx cap add android
          npx cap sync android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&<uses-permission android:name="android.permission.RECORD_AUDIO" /><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" /><uses-permission android:name="com.android.alarm.permission.SET_ALARM" />#' $M
          sed -i 's#</manifest>#<queries><intent><action android:name="android.intent.action.TTS_SERVICE" /></intent><intent><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent></queries></manifest>#' $M
          grep RECORD_AUDIO $M
          grep SET_ALARM $M
          grep TTS_SERVICE $M
          D=android/app/src/main/java/com/zephyrix/jarvis
          cat > $D/JarvisPlugin.java <<'EOF'
          package com.zephyrix.jarvis;
          import android.app.SearchManager;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.net.Uri;
          import android.provider.AlarmClock;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.util.Locale;
          @CapacitorPlugin(name = "Jarvis")
          public class JarvisPlugin extends Plugin {
            @PluginMethod
            public void setAlarm(PluginCall call) {
              int h = call.getInt("hour", 0);
              int m = call.getInt("minute", 0);
              Intent i = new Intent(AlarmClock.ACTION_SET_ALARM);
              i.putExtra(AlarmClock.EXTRA_HOUR, h);
              i.putExtra(AlarmClock.EXTRA_MINUTES, m);
              i.putExtra(AlarmClock.EXTRA_MESSAGE, call.getString("label", "JARVIS"));
              i.putExtra(AlarmClock.EXTRA_SKIP_UI, true);
              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
              try { getContext().startActivity(i); call.resolve(); }
              catch (Exception e) { call.reject(String.valueOf(e.getMessage())); }
            }
            @PluginMethod
            public void setTimer(PluginCall call) {
              int s = call.getInt("seconds", 60);
              Intent i = new Intent(AlarmClock.ACTION_SET_TIMER);
              i.putExtra(AlarmClock.EXTRA_LENGTH, s);
              i.putExtra(AlarmClock.EXTRA_MESSAGE, call.getString("label", "JARVIS"));
              i.putExtra(AlarmClock.EXTRA_SKIP_UI, true);
              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
              try { getContext().startActivity(i); call.resolve(); }
              catch (Exception e) { call.reject(String.valueOf(e.getMessage())); }
            }
            @PluginMethod
            public void openApp(PluginCall call) {
              String q = call.getString("name", "").toLowerCase(Locale.ROOT).trim();
              if (q.isEmpty()) { call.reject("Uygulama adı boş"); return; }
              PackageManager pm = getContext().getPackageManager();
              Intent main = new Intent(Intent.ACTION_MAIN);
              main.addCategory(Intent.CATEGORY_LAUNCHER);
              ResolveInfo best = null;
              for (ResolveInfo r : pm.queryIntentActivities(main, 0)) {
                String l = r.loadLabel(pm).toString().toLowerCase(Locale.ROOT);
                if (l.equals(q)) { best = r; break; }
                if (best == null && l.length() > 1 && (l.contains(q) || q.contains(l))) best = r;
              }
              if (best == null) { call.reject("Uygulama bulunamadı"); return; }
              Intent i = pm.getLaunchIntentForPackage(best.activityInfo.packageName);
              if (i == null) { call.reject("Uygulama açılamadı"); return; }
              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
              try {
                getContext().startActivity(i);
                JSObject o = new JSObject();
                o.put("app", best.loadLabel(pm).toString());
                call.resolve(o);
              } catch (Exception e) { call.reject(String.valueOf(e.getMessage())); }
            }
            @PluginMethod
            public void webSearch(PluginCall call) {
              String q = call.getString("query", "");
              Intent i = new Intent(Intent.ACTION_WEB_SEARCH);
              i.putExtra(SearchManager.QUERY, q);
              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
              try { getContext().startActivity(i); call.resolve(); return; }
              catch (Exception e) { }
              try {
                Intent v = new Intent(Intent.ACTION_VIEW, Uri.parse("https://www.google.com/search?q=" + Uri.encode(q)));
                v.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                getContext().startActivity(v);
                call.resolve();
              } catch (Exception e2) { call.reject(String.valueOf(e2.getMessage())); }
            }
            @PluginMethod
            public void openUrl(PluginCall call) {
              String u = call.getString("url", "");
              if (!u.startsWith("https://")) { call.reject("Geçersiz adres"); return; }
              try {
                Intent v = new Intent(Intent.ACTION_VIEW, Uri.parse(u));
                v.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                getContext().startActivity(v);
                call.resolve();
              } catch (Exception e) { call.reject(String.valueOf(e.getMessage())); }
            }
          }
          EOF
          cat > $D/MainActivity.java <<'EOF'
          package com.zephyrix.jarvis;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle b) {
              registerPlugin(JarvisPlugin.class);
              super.onCreate(b);
            }
          }
          EOF
      - name: Simge ve acilis ekrani
        run: |
          cd app
          python3 -m pip install --break-system-packages pillow
          python3 - <<'PY'
          import os, glob
          from PIL import Image
          res = "android/app/src/main/res"
          src = Image.open("../ikon-512.png").convert("RGBA")
          for d, n in {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}.items():
              p = res + "/mipmap-" + d
              assert os.path.isdir(p), p
              im = src.resize((n, n), Image.LANCZOS)
              im.save(p + "/ic_launcher.png")
              im.save(p + "/ic_launcher_round.png")
          for f in glob.glob(res + "/drawable*/splash.png"):
              os.remove(f)
          xml = """<?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
            <item>
              <shape android:shape="rectangle">
                <solid android:color="#02040A"/>
              </shape>
            </item>
            <item android:gravity="center" android:width="160dp" android:height="160dp">
              <bitmap android:src="@mipmap/ic_launcher" android:gravity="fill"/>
            </item>
          </layer-list>
          """
          open(res + "/drawable/splash.xml", "w").write(xml)
          PY
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          ls android/app/src/main/res/drawable
      - name: APK derle
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
