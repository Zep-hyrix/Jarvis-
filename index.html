<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS</title>
<style>
:root{--bg:#02040a;--fg:#cfe8ff;--ac:#3fb6ff;--mut:#6b86a3}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
body{display:flex;flex-direction:column}
canvas{width:100%;height:42vh;display:block}
#log{flex:1;overflow-y:auto;padding:8px 14px;font-size:16px;line-height:1.45}
.u{color:var(--mut);margin:8px 0}.a{margin:8px 0}
#bar{display:flex;gap:8px;padding:10px;border-top:1px solid #12233a}
#t{flex:1;background:#06101e;color:var(--fg);border:1px solid #1d3a5c;border-radius:10px;padding:12px;font-size:16px}
button{background:#0a2540;color:var(--fg);border:1px solid var(--ac);border-radius:10px;padding:0 16px;font-size:16px}
#mic.on{background:var(--ac);color:#02040a}
#set{display:none;padding:10px;gap:8px;flex-direction:column;border-bottom:1px solid #12233a}
#set input{background:#06101e;color:var(--fg);border:1px solid #1d3a5c;border-radius:8px;padding:10px;font-size:15px}
#gear{position:fixed;top:8px;right:8px;padding:6px 10px}
</style>
</head>
<body>
<button id="gear">⚙</button>
<div id="set">
  <input id="key" placeholder="Gemini API anahtarı" type="password">
  <input id="model" placeholder="Model (ör. gemini-2.5-flash)">
  <button id="save" style="padding:10px">Kaydet</button>
</div>
<canvas id="c"></canvas>
<div id="log"></div>
<div id="bar">
  <input id="t" placeholder="Yaz ya da mikrofona bas…" autocomplete="off">
  <button id="mic">🎤</button>
  <button id="send">Gönder</button>
</div>
<script>
const $=id=>document.getElementById(id);
const cv=$("c"),ctx=cv.getContext("2d");
let state="idle",ph=0;
function fit(){cv.width=cv.clientWidth*devicePixelRatio;cv.height=cv.clientHeight*devicePixelRatio}
addEventListener("resize",fit);fit();
const pts=Array.from({length:140},()=>({a:Math.random()*6.28,b:Math.random()*6.28,s:.2+Math.random()*.8}));
function draw(){
  const w=cv.width,h=cv.height,cx=w/2,cy=h/2,R=Math.min(w,h)*.32;
  ctx.clearRect(0,0,w,h);ph+=state==="idle"?.01:state==="think"?.05:.03;
  const pulse=state==="speak"?1+.06*Math.sin(ph*8):state==="listen"?1+.04*Math.sin(ph*5):1;
  const g=ctx.createRadialGradient(cx,cy,R*.2,cx,cy,R*1.5*pulse);
  g.addColorStop(0,"rgba(63,182,255,.35)");g.addColorStop(1,"rgba(63,182,255,0)");
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  ctx.strokeStyle="rgba(120,210,255,.8)";ctx.lineWidth=2*devicePixelRatio;
  ctx.beginPath();ctx.arc(cx,cy,R*pulse,0,6.28);ctx.stroke();
  for(let i=0;i<3;i++){
    ctx.strokeStyle=`rgba(140,160,255,${.5-i*.12})`;
    ctx.beginPath();ctx.ellipse(cx,cy,R*pulse,R*pulse*(.35+.2*i),ph*(1+i*.4)+i,0,6.28);ctx.stroke();
  }
  pts.forEach(p=>{
    const x=cx+Math.cos(p.a+ph*p.s)*R*pulse*Math.sin(p.b),y=cy+Math.sin(p.a+ph*p.s)*R*pulse*Math.sin(p.b)*.9;
    ctx.fillStyle="rgba(180,230,255,.8)";ctx.fillRect(x,y,2*devicePixelRatio,2*devicePixelRatio);
  });
  requestAnimationFrame(draw);
}
draw();

const log=$("log");
function add(cls,txt){const d=document.createElement("div");d.className=cls;d.textContent=txt;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
let key="",model="gemini-2.5-flash";
try{key=localStorage.getItem("gk")||"";model=localStorage.getItem("gm")||model}catch(e){}
$("key").value=key;$("model").value=model;
$("gear").onclick=()=>{const s=$("set");s.style.display=s.style.display==="flex"?"none":"flex"};
$("save").onclick=()=>{key=$("key").value.trim();model=$("model").value.trim()||model;
  try{localStorage.setItem("gk",key);localStorage.setItem("gm",model)}catch(e){}
  $("set").style.display="none";add("a","Ayarlar kaydedildi.")};
if(!key){add("a","Merhaba. Sağ üstteki ⚙ simgesinden Gemini API anahtarını gir, sonra konuşabiliriz.");$("set").style.display="flex"}

const hist=[];
const SYS="Sen JARVIS adında, Türkçe konuşan, kısa ve net cevap veren kişisel bir asistansın. Cevapların sesli okunacağı için biçimlendirme, madde işareti ve emoji kullanma.";
async function ask(q){
  if(!key){add("a","Önce ⚙ içinden API anahtarını gir.");return}
  add("u",q);hist.push({role:"user",parts:[{text:q}]});state="think";
  try{
    const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+model+":generateContent?key="+encodeURIComponent(key),{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({systemInstruction:{parts:[{text:SYS}]},contents:hist})});
    const j=await r.json();
    if(!r.ok)throw new Error(j.error&&j.error.message||r.status);
    const txt=j.candidates[0].content.parts.map(p=>p.text||"").join("");
    hist.push({role:"model",parts:[{text:txt}]});add("a",txt);speak(txt);
  }catch(e){state="idle";add("a","Hata: "+e.message)}
}
function speak(t){
  if(!("speechSynthesis" in window)){state="idle";return}
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="tr-TR";
  u.onstart=()=>state="speak";u.onend=u.onerror=()=>state="idle";speechSynthesis.speak(u);
}
function send(){const v=$("t").value.trim();if(!v)return;$("t").value="";ask(v)}
$("send").onclick=send;$("t").onkeydown=e=>{if(e.key==="Enter")send()};

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null;
$("mic").onclick=()=>{
  if(!SR){add("a","Bu tarayıcıda ses tanıma yok. Klavyedeki 🎤 (Celia Klavye) ile konuşup yazıya çevirebilirsin.");$("t").focus();return}
  if(rec){rec.stop();return}
  rec=new SR();rec.lang="tr-TR";rec.interimResults=false;
  rec.onstart=()=>{state="listen";$("mic").classList.add("on")};
  rec.onresult=e=>{ask(e.results[0][0].transcript)};
  rec.onerror=e=>add("a","Mikrofon hatası: "+e.error);
  rec.onend=()=>{rec=null;$("mic").classList.remove("on");if(state==="listen")state="idle"};
  rec.start();
};
</script>
</body>
</html>
